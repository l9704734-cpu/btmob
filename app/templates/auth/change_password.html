<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #0f9d58; }
        .btn { width: 100%; padding: 12px; background: #0f9d58; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .success { background: rgba(15,157,88,0.1); border: 1px solid rgba(15,157,88,0.2); color: #0d652b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .error { background: rgba(234,67,53,0.1); border: 1px solid rgba(234,67,53,0.2); color: #c5221f; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .back { display: block; margin-top: 16px; text-align: center; color: #64748b; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Change Password</h1>
        {% if success %}<div class="success">Password changed successfully.</div>{% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group"><label>Current Password</label><input type="password" name="current_password" required></div>
            <div class="form-group"><label>New Password</label><input type="password" name="new_password" required></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" required></div>
            <button type="submit" class="btn">Change Password</button>
        </form>
        <a href="{{ url_for('admin.account') }}" class="back">&larr; Back to Account</a>
    </div>
</body>
</html>
